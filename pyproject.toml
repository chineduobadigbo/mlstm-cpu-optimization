[project]
name = "mlstm-cpu"
version = "0.1.0"
description = "CPU inference kernels for the mLSTM memory core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
]

[dependency-groups]
dev = [
    "ninja",
    "pytest",
    "setuptools",
]
real-model-benchmark = [
    "transformers==5.9.0",
    "huggingface-hub==1.27.0",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
